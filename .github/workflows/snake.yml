name: Generate contribution snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alvarenga97
          outputs: |
            dist/github-snake.svg?color_snake=%2300FF00&color_dots=%230D1117,%23003B1F,%23006D32,%2326A641,%2339D353
            dist/github-snake-dark.svg?color_snake=%2300FF00&color_dots=%230D1117,%23003B1F,%23006D32,%2326A641,%2339D353

      - name: Publish snake files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
